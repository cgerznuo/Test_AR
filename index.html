<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Naevis Chiby AR</title>
<style>
  html{background:#000} body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  #ar{position:absolute;inset:0;z-index:0;overflow:hidden}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff;color:#111;z-index:10;text-align:center;padding:24px;box-sizing:border-box}
  #ui img{width:38vw;max-width:180px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  #start{font-size:18px;padding:14px 36px;border:0;border-radius:999px;background:#111;color:#fff}
  #start:disabled{opacity:.4}
  #zoom{position:absolute;right:16px;bottom:24px;z-index:6;display:none;flex-direction:column;align-items:center;gap:10px}
  #zoom button{width:52px;height:52px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:28px;line-height:52px;padding:0;-webkit-tap-highlight-color:transparent}
  #zoom span{color:#fff;font-size:12px;text-shadow:0 1px 2px #000}
  #hint{position:absolute;left:0;right:80px;bottom:28px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;z-index:5;display:none}
</style>
<script type="importmap">
{"imports":{
  "three":"./lib/three/three.module.js",
  "three/addons/":"./lib/three/addons/",
  "mindar-image-three":"./lib/mindar/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>
<div id="zoom"><button id="zin" aria-label="크게">+</button><span id="zval">100%</span><button id="zout" aria-label="작게">−</button></div>
<div id="hint">카드의 사각 프레임 전체가 화면에 들어오게 비춰 주세요</div>
<div id="ui">
  <img src="marker.png" alt="marker">
  <div id="msg">캐릭터 불러오는 중… <span id="pct">0</span>%</div>
  <form id="pwbox" style="display:none;gap:8px">
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off" style="font-size:16px;padding:10px 14px;border:1px solid #ccc;border-radius:8px">
    <button style="font-size:16px;padding:10px 18px;border:0;border-radius:8px;background:#111;color:#fff">확인</button>
  </form>
  <button id="start" disabled>AR 시작</button>
  <div style="font-size:12px;color:#888">카메라 권한을 허용해 주세요</div>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {MindARThree} from 'mindar-image-three';
import {attachAutoFocal} from './autofocal.js';

const SKIP_START = 0.1;   // 첫 프레임 T포즈 건너뛰기(초)
const STAGE_FIT = 0.9;    // 안무 전체 이동 범위가 프레임 안쪽의 몇 %를 쓰게 할지 (크기 조절은 이 값)

const $ = id => document.getElementById(id);

// 카메라 화각(폰 카메라 긴 변 기준, 도). MindAR 기본값(45° 고정)은 폰에서 축이 틀어짐 → 66°로 보정
// 시작값일 뿐이며, 카드를 비스듬히 비추면 autofocal.js가 프레임 원근으로 실제 화각을 자동 계산해 교체한다.
// ?debug 를 붙이면 프레임 외곽선·안무 범위·축·추정 화각 표시
const Q = new URLSearchParams(location.search);
const FOV = +Q.get('fov') || 66;
const DEBUG = Q.has('debug');
window.MINDAR_FOV_LONG = FOV;
const FRAME_HALF = 830 / 1800;   // 인쇄 카드에서 검은 프레임 바깥선 위치(카드 가로폭=1 기준)

// 1) 암호화된 캐릭터 다운로드
async function download(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('다운로드 실패 ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  const reader = r.body.getReader(); const chunks = []; let got = 0;
  for (;;) {
    const {done, value} = await reader.read(); if (done) break;
    chunks.push(value); got += value.length;
    if (total) $('pct').textContent = Math.min(100, Math.round(got / total * 100));
  }
  const buf = new Uint8Array(got); let o = 0; for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf;
}
// 형식: 'NVE1' | salt16 | iv12 | AES-GCM 암호문  (tools/encrypt_glb.py와 동일)
async function decrypt(buf, password) {
  const salt = buf.slice(4, 20), iv = buf.slice(20, 32), ct = buf.slice(32);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256'},
    base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return crypto.subtle.decrypt({name: 'AES-GCM', iv}, key, ct);
}
const askPassword = (msg) => new Promise(res => {
  $('msg').textContent = msg; $('pwbox').style.display = 'flex'; $('pw').focus();
  $('pwbox').onsubmit = e => { e.preventDefault(); $('pwbox').style.display = 'none'; res($('pw').value); };
});

const enc = await download('naevis.glb.enc');
// QR 주소의 #k=… 로 자동 잠금해제 (# 뒤는 서버로 전송되지 않음). 읽은 뒤 주소창에서 지움
let password = new URLSearchParams(location.hash.slice(1)).get('k');
if (location.hash) history.replaceState(null, '', location.pathname + location.search);
let glbData = null;
for (let msg = '비밀번호를 입력해 주세요'; !glbData; msg = '비밀번호가 맞지 않아요') {
  if (!password) password = await askPassword(msg);
  $('msg').textContent = '잠금 해제 중…';
  try { glbData = await decrypt(enc, password); } catch { password = null; }
}

const loader = new GLTFLoader();
const draco = new DRACOLoader(); draco.setDecoderPath('./lib/draco/'); loader.setDRACOLoader(draco);
const gltf = await new Promise((res, rej) => loader.parse(glbData, './', res, rej));
$('msg').textContent = '준비 완료';
$('start').disabled = false;

// 2) 캐릭터 배치: 마커(XY 평면) 위에 서도록 +90° 회전
const model = gltf.scene;
model.traverse(o => { if (o.isMesh) o.frustumCulled = false; });   // 스키닝 메시가 잘못 잘려나가는 것 방지
const mixer = new THREE.AnimationMixer(model);
const clip = gltf.animations[0];
const action = mixer.clipAction(clip);
action.play();
mixer.setTime(SKIP_START);
// 무대 = 애니메이션 원점(씬 원점)을 프레임 중심에 그대로 둠. 데이터는 손대지 않고 재생.
// 안무 전체를 훑어 본(관절)들의 이동 범위를 구하고, 그 범위가 프레임 안에 들어오도록 무대 전체를 균일 축소
const STAGE = {minX: Infinity, maxX: -Infinity, minZ: Infinity, maxZ: -Infinity, maxY: 0};
const bones = []; model.traverse(o => { if (o.isBone) bones.push(o); });
const v = new THREE.Vector3();
for (let t = 0; t <= clip.duration; t += 1 / 12) {
  mixer.setTime(t); model.updateMatrixWorld(true);
  for (const bn of bones) {
    bn.getWorldPosition(v);
    STAGE.minX = Math.min(STAGE.minX, v.x); STAGE.maxX = Math.max(STAGE.maxX, v.x);
    STAGE.minZ = Math.min(STAGE.minZ, v.z); STAGE.maxZ = Math.max(STAGE.maxZ, v.z);
    STAGE.maxY = Math.max(STAGE.maxY, v.y);
  }
}
mixer.setTime(SKIP_START);
const margin = STAGE.maxY * 0.08;   // 관절 바깥으로 나오는 몸·옷 두께 여유
const reach = Math.max(-STAGE.minX, STAGE.maxX, -STAGE.minZ, STAGE.maxZ) + margin;
const s = (FRAME_HALF - 0.02) * STAGE_FIT / reach;
model.scale.setScalar(s);           // 위치는 원점 그대로
window.stageInfo = {...STAGE, reach, scale: s, charHeight: STAGE.maxY * s};
const holder = new THREE.Group();
holder.add(model);
holder.rotation.x = Math.PI / 2;
holder.visible = false;

mixer.addEventListener('loop', () => { action.time = SKIP_START; });

// 3) AR 시작
$('start').onclick = async () => {
  $('start').disabled = true; $('msg').textContent = '카메라 여는 중…';
  const mindar = new MindARThree({
    container: $('ar'), imageTargetSrc: './marker.mind',
    uiScanning: 'no', uiLoading: 'no', filterMinCF: 0.001, filterBeta: 10
  });
  const {renderer, scene, camera} = mindar;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2.2));
  const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(0.5, 1, 1.5); scene.add(dl);

  const anchor = mindar.addAnchor(0);
  anchor.group.add(holder);
  if (DEBUG) {
    const f = FRAME_HALF, pts = [[-f,-f],[f,-f],[f,f],[-f,f]].map(([x,y]) => new THREE.Vector3(x, y, 0.002));
    anchor.group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color: 0xff0044})));
    anchor.group.add(new THREE.AxesHelper(0.3));
    // 노랑: 안무 이동 범위(관절 기준). 무대 좌표 x→카드 X, z→카드 -Y
    const S = STAGE, k = s, foot = [[S.minX, S.minZ], [S.maxX, S.minZ], [S.maxX, S.maxZ], [S.minX, S.maxZ]].map(([x, z]) => new THREE.Vector3(x * k, -z * k, 0.003));
    anchor.group.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(foot), new THREE.LineBasicMaterial({color: 0xffcc00})));   // 빨강=X(카드 오른쪽), 초록=Y(카드 위쪽), 파랑=Z(카드에서 수직으로 위)
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.6), new THREE.MeshBasicMaterial({color: 0x00aaff}));
    pole.rotation.x = Math.PI / 2; pole.position.set(-f + 0.05, -f + 0.05, 0.3); anchor.group.add(pole);
    const panel = document.createElement('div');
    panel.style.cssText = 'position:absolute;top:10px;left:10px;right:10px;z-index:20;color:#fff;font:14px sans-serif;text-shadow:0 1px 2px #000;display:flex;gap:6px;align-items:center;flex-wrap:wrap';
    panel.innerHTML = `<span id="dbg">FOV ${FOV}°</span>`;
    document.body.appendChild(panel);
  }
  anchor.onTargetFound = () => { holder.visible = true; $('hint').style.display = 'none'; };
  anchor.onTargetLost  = () => { holder.visible = false; $('hint').style.display = 'block'; };

  try { await mindar.start(); }
  catch (e) { $('msg').textContent = '카메라를 열 수 없어요: ' + e.message; $('start').disabled = false; return; }
  $('ui').style.display = 'none'; $('hint').style.display = 'block';

  // 전체 무대 크기 +/- (원점=프레임 중심 기준으로 균일 확대·축소)
  let zoom = 1;
  const setZoom = z => { zoom = Math.min(4, Math.max(0.3, z)); holder.scale.setScalar(zoom); $('zval').textContent = Math.round(zoom * 100) + '%'; };
  $('zin').onclick = () => setZoom(zoom * 1.15);
  $('zout').onclick = () => setZoom(zoom / 1.15);
  $('zoom').style.display = 'flex';

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = clock.getDelta();
    if (holder.visible) mixer.update(dt);
    renderer.render(scene, camera);
  });
  const c = mindar.controller;
  const info = (extra = '') => DEBUG && ($('dbg').textContent = `화각 ${af.fovLong.toFixed(1)}° (샘플 ${af.samples}) · 영상 ${c.inputWidth}×${c.inputHeight} · 무대 축척 ${s.toFixed(3)} ${extra}`);
  const af = attachAutoFocal(mindar, {
    onChange: (fov) => { window.fovApplied = fov; info('· 갱신됨'); },
    onSample: (r, fov) => { window.lastSample = {fov, tilt: r.tilt}; info(`· 측정 ${fov.toFixed(1)}° 기울기 ${r.tilt.toFixed(0)}°`); }
  });
  window.af = af;
  window.status = 'running';
};
window.status = 'ready';
</script>
</body>
</html>
